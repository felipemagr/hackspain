# Render Blueprint: New > Blueprint > pick this repo. Both services are free, no card.
services:
  # The demo. Static on a CDN, never sleeps. Reads web/public/data/*.json (run `make web-data`
  # and commit after the serving tables change).
  - type: web
    name: xray
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # The API. Free instances sleep after 15 min idle and take about a minute to wake.
  - type: web
    name: xray-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: XRAY_ENV
        value: prod
      - key: XRAY_CORS_ORIGINS
        value: '["https://xray.onrender.com"]'
