# Render Blueprint: New > Blueprint > pick this repo. Both services are free, no card.
services:
  # The demo. Static on a CDN, never sleeps. Reads web/public/data/*.json (run `make web-data`
  # and commit after the serving tables change).
  - type: web
    name: lighthouse
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Vite bakes it in at build time: the Agents tab calls the API, nothing else does.
      - key: VITE_API_URL
        value: https://lighthouse-api-sku5.onrender.com
      # The same value as LIGHTHOUSE_API_KEY on the API. Set it in the Render dashboard, then redeploy:
      # Vite bakes it in at build time too.
      - key: VITE_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # The API. Free instances sleep after 15 min idle and take about a minute to wake.
  - type: web
    name: lighthouse-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # One deploy per push, and only once GitHub Actions is green.
    autoDeployTrigger: checksPass
    envVars:
      - key: XRAY_ENV
        value: prod
      # The key every /api/v1 call must carry in X-API-Key. Set the value in the Render dashboard.
      - key: LIGHTHOUSE_API_KEY
        sync: false
      # Only the Agents chat needs these. Set the values in the Render dashboard.
      - key: HELMCODE_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: XRAY_CORS_ORIGINS
        value: '["https://lighthouse-1qeo.onrender.com"]'
