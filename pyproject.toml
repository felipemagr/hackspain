[project]
name = "xray"
version = "0.1.0"
description = "Financial health score from a company's financial trail"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
# Batch pipeline only: kept out of the API image.
pipeline = [
    "pyarrow>=25.0.1",
    "scikit-learn>=1.5",
]
dev = [
    "ipykernel>=6.29",
    "matplotlib>=3.11.2",
    "nbstripout>=0.7",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
default-groups = ["dev", "pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xray"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
